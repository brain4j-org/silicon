plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.3.0'
}

group = 'org.silicon'
version = '0.2.0'

def javaVersion = 22

subprojects {
    version = rootProject.version
    group = rootProject.group

    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'com.gradleup.shadow'

    repositories {
        mavenCentral()
        maven {
            name "brain4jReleases"
            url "https://repo.brain4j.org/releases"
        }
    }

    shadowJar {
        archiveClassifier.set("")
    }

    publishing {
        repositories {
            maven {
                name = "silicon"

                def releasesRepo = uri("https://repo.brain4j.org/releases")
                def snapshotsRepo = uri("https://repo.brain4j.org/snapshots")

                url = (version as String).endsWith("SNAPSHOT") ? snapshotsRepo : releasesRepo

                credentials {
                    username = findProperty("BRAIN4J_USER") ?: System.getenv("BRAIN4J_USER")
                    password = findProperty("BRAIN4J_PASS") ?: System.getenv("BRAIN4J_PASS")
                }

                authentication {
                    create("basic", BasicAuthentication)
                }
            }
        }

        publications {
            create("gpr", MavenPublication) {
                from components.java
                groupId = group
                artifactId = project.name
                version = version
            }
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }

        // publishes -javadoc.jar and -sources.jar alongside the main artifact.
        withJavadocJar()
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = javaVersion
    }

    tasks.withType(Javadoc).configureEach {
        // missing comments must not fail the build.
        failOnError = false
        (options as StandardJavadocDocletOptions).addStringOption('Xdoclint:none', '-quiet')
    }
}

tasks.register('buildAll') {
    dependsOn ':silicon-api:shadowJar'
    dependsOn ':silicon-cuda:shadowJar'
    dependsOn ':silicon-metal:shadowJar'
    dependsOn ':silicon-opencl:shadowJar'

    doLast {
        println 'Built all modules.'
    }
}

tasks.register('publishAll') {
    dependsOn ':silicon-api:publish'
    dependsOn ':silicon-cuda:publish'
    dependsOn ':silicon-metal:publish'
    dependsOn ':silicon-opencl:publish'

    doLast {
        println 'Published all modules to the main repository.'
    }
}
